services:
  db:
    image: mysql:8.0.43
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - f1-visualizer-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_PASSWORD
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: final/backend/dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python setup_db.py --docker &&
        python setup_db.py --prod --docker &&
        uvicorn main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: [ "CMD-SHELL", "[ -f /tmp/db_setup_sample_done ] && [ -f /tmp/db_setup_prod_done ]" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: final/frontend/dockerfile
    container_name: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  f1-visualizer-data:
